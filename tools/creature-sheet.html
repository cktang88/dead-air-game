<!doctype html>
<meta charset="utf-8">
<title>Creature contact sheet</title>
<body style="margin:0;background:#1a1722">
<canvas id="c" width="1600" height="900"></canvas>
<script type="module">
// Contact sheet for the non-humanoid stacked bodies.
// ?kind=rusher|rusher.elite|brute|brute.elite|conductor  ?zoom=1..4  ?rows=stand,walk,wind,strike,act,dead,fidget  ?cols=8 ?h=90 ?w=...
import {setSpriteScale} from '../sprites2d.js';
import {beginStackFrame, stackStats} from '../stack2d.js';
import {CREATURES} from '../creatures2d.js';
const q = new URLSearchParams(location.search);
const kind = q.get('kind') || 'rusher', zoom = +(q.get('zoom') || 2), rows = (q.get('rows') || 'stand,walk,wind,strike,act,dead').split(','), cols = +(q.get('cols') || 8);
const c = document.getElementById('c'), ctx = c.getContext('2d');
if (q.get('h2')) c.height = +q.get('h2');
setSpriteScale(zoom);
const C = CREATURES[kind];
const bg = (x, y, w, h) => { ctx.fillStyle = '#2b2736'; ctx.fillRect(x, y, w, h); ctx.fillStyle = 'rgba(255,255,255,0.03)'; for (let i = 0; i < w; i += 32) ctx.fillRect(x + i, y, 1, h); for (let j = 0; j < h; j += 32) ctx.fillRect(x, y + j, w, 1); };
function cellDraw(x, y, w, h, label, o) {
  bg(x, y, w, h);
  beginStackFrame();
  const out = C.pose({id: 3, t: 1.3, bodyYaw: o.ang ?? 0, ...o});
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  C.draw(ctx, out, x + w / 2, y + h * (C.cy ?? 0.58), o);
  ctx.restore();
  ctx.fillStyle = '#aaa'; ctx.font = `${10 / zoom}px monospace`; ctx.fillText(label, x + 4, y + 12 / zoom);
}
function drawAll() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#1a1722'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.scale(zoom, zoom);
  const cw = c.width / zoom, W = cw / cols, H = +(q.get('h') || C.h || Math.max(70, 90 / Math.max(1, zoom / 2)));
  let r = 0;
  const adv = Math.ceil(8 / cols);
  const row = (f) => { for (let i = 0; i < 8; i++) { const [label, o] = f(i); cellDraw((i % cols) * W, (r + Math.floor(i / cols)) * H, W - 1, H - 1, label, o); } r += adv; };
  if (rows.includes('stand')) row((i) => [`stand ${i * 45}`, {ang: i * Math.PI / 4}]);
  if (rows.includes('walk')) {
    row((i) => [`walk E ph${i}/8`, {ang: 0, move: 0, amp: 1, phase: i / 8}]);
    row((i) => [`walk S ph${i}/8`, {ang: Math.PI / 2, move: Math.PI / 2, amp: 1, phase: i / 8}]);
    row((i) => [`strafe mv${i * 45}`, {ang: 0, move: i * Math.PI / 4, amp: 1, phase: 0.2}]);
  }
  if (rows.includes('wind')) row((i) => [`wind ${(i / 7).toFixed(2)}`, {ang: 0.3, wind: i / 7}]);
  if (rows.includes('strike')) row((i) => [`strike ${(i / 7).toFixed(2)}`, {ang: 0.3, lunge: 1 - i / 7}]);
  if (rows.includes('act')) row((i) => C.acts[i] || ['', {}]);
  if (rows.includes('dead')) row((i) => [`dead ${C.deadAt[i].toFixed(2)}s`, {ang: 0.4, dead: Math.min(1, C.deadAt[i] / C.deadDur), deadT: C.deadAt[i], fall: 0.5, spin: 1, dying: true}]);
  if (rows.includes('fidget')) row((i) => C.fidgets[i] || ['', {}]);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#9f9'; ctx.font = '12px monospace'; ctx.fillText(`bakes ${stackStats.bakes} ${stackStats.mb.toFixed(1)}MB bakeMs ${stackStats.bakeMs.toFixed(0)}`, 8, c.height - 8);
}
window.__sheet = {drawAll};
requestAnimationFrame(() => { drawAll(); drawAll(); window.__ready = true; });
</script>
